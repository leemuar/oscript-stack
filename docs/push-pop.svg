<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
	<rect x="0" y="0" width="720" height="580" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

	<text x="360" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Стек: push() / pop()</text>

	<!-- ==================== ROW 1: push ==================== -->
	<g transform="translate(113,60)">

		<text x="102" y="52" text-anchor="middle" font-size="12" fill="#57606a">До</text>
		<text x="392" y="52" text-anchor="middle" font-size="12" fill="#57606a">После</text>

		<!-- before: [1, 2] -->
		<rect x="70" y="122" width="64" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
		<text x="102" y="149" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2328">2</text>
		<rect x="70" y="166" width="64" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
		<text x="102" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2328">1</text>

		<!-- arrow -->
		<line x1="178" y1="170" x2="322" y2="170" stroke="#57606a" stroke-width="2"/>
		<polygon points="322,163 336,170 322,177" fill="#57606a"/>
		<text x="250" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#1f2328">push(3)</text>
		<text x="250" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#57606a">Добавить(3)</text>

		<!-- after: [1, 2, 3] , 3 is newly added -->
		<rect x="360" y="78" width="64" height="44" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
		<text x="392" y="105" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1a7f37" font-weight="600">3</text>
		<rect x="360" y="122" width="64" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
		<text x="392" y="149" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2328">2</text>
		<rect x="360" y="166" width="64" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
		<text x="392" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2328">1</text>

		<text x="392" y="238" text-anchor="middle" font-size="11" fill="#1a7f37">новый элемент на вершине</text>
	</g>

	<!-- ==================== ROW 2: pop ==================== -->
	<g transform="translate(113,320)">

		<text x="102" y="12" text-anchor="middle" font-size="12" fill="#57606a">До</text>
		<text x="392" y="12" text-anchor="middle" font-size="12" fill="#57606a">После</text>

		<!-- before: [1, 2, 3], 3 is about to be removed -->
		<rect x="70" y="38" width="64" height="44" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="5 3"/>
		<text x="102" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#bc4c00" font-weight="600">3</text>
		<rect x="70" y="82" width="64" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
		<text x="102" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2328">2</text>
		<rect x="70" y="126" width="64" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
		<text x="102" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2328">1</text>

		<!-- arrow -->
		<line x1="178" y1="90" x2="322" y2="90" stroke="#57606a" stroke-width="2"/>
		<polygon points="322,83 336,90 322,97" fill="#57606a"/>
		<text x="250" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600" fill="#1f2328">pop()</text>
		<text x="250" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#57606a">Удалить()</text>

		<!-- returned value -->
		<line x1="250" y1="128" x2="250" y2="150" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="3 2"/>
		<rect x="222" y="150" width="56" height="36" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
		<text x="250" y="173" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#bc4c00" font-weight="600">3</text>
		<text x="250" y="202" text-anchor="middle" font-size="11" fill="#bc4c00">возвращает</text>

		<!-- after: [1, 2] -->
		<rect x="360" y="82" width="64" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
		<text x="392" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#0969da" font-weight="600">2</text>
		<rect x="360" y="126" width="64" height="44" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
		<text x="392" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#1f2328">1</text>

		<text x="392" y="198" text-anchor="middle" font-size="11" fill="#0969da">новая вершина стека</text>
	</g>

	<!-- ==================== Легенда ==================== -->
	<g transform="translate(0,542)">
		<rect x="60" y="0" width="14" height="14" rx="3" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
		<text x="80" y="11" font-size="11" fill="#57606a">добавлено push()/Добавить()</text>

		<rect x="300" y="0" width="14" height="14" rx="3" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="4 2"/>
		<text x="320" y="11" font-size="11" fill="#57606a">снимается pop()/Удалить()</text>

		<rect x="530" y="0" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
		<text x="550" y="11" font-size="11" fill="#57606a">новая вершина</text>
	</g>
</svg>
